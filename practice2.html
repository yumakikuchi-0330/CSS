<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <title>たまごっち</title>
        <link rel="stylesheet" href="practice2.css">
</head>
<body>
    <div class="header">
        <h1>たまごっちメンバー</h1>
        <p>シンプルで整ったデザインのページを作成します。</p>
    </div>
    <div class="cards">
        <div class="card">
            <div class="title1">
                <h2>タイトル1</h2>
                <p>これは最初の情報カードです。</p>
            </div>
            <div class="title2">
                <h2>タイトル2</h2>
                <p>これは2つ目の情報カードです。</p>
            </div>
            <div class="title3">
                <h2>タイトル3</h2>
                <p>これは3つ目の情報カードです。</p>
            </div>
        </div>
    </div>
    <section class="table-section">
        <h2>データ一覧</h2>
        <table>
            <thead>
                <tr>
                    <th>項目</th>
                    <th>説明</th>
                    <th>データ</th>
                </tr>
            </thead>
                <tr>
                    <td>まめっち</td>
                    <td>説明1</td>
                    <td>データ1</td>
                </tr>
                <tr>
                    <td>めめっち</td>
                    <td>説明2</td>
                    <td>データ2</td>
                </tr>
                <tr>
                    <td>くちぱっち</td>
                    <td>説明3</td>
                    <td>データ3</td>
                </tr>
        </table>
    </section>
</body>
</html>
