<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <title>たまごっち</title>
        <link rel="stylesheet" href="practice2.css">
</head>
<body>
    <div class="header">
        <h1>たまごっちメンバー</h1>
        <p>シンプルで整ったデザインのページを作成します。</p>
    </div>
    <div class="cards">
        <div class="card">
            <div class="title1-card">
                <h2>タイトル1</h2>
                <p>これは最初の情報カードです。</p>
            </div>
            <div class="title2-card">
                <h2>タイトル2</h2>
                <p>これは2つ目の情報カードです。</p>
            </div>
            <div class="title3-card">
                <h2>タイトル3</h2>
                <p>これは3つ目の情報カードです。</p>
            </div>
        </div>
    </div>
    <section class="table-section">
        <h2 class="table-h2">データ一覧</h2>
        <table class="table-name">
            <thead class="table-thead">
                <tr class="table-tr">
                    <th class="table-th">項目</th>
                    <th class="table-th">説明</th>
                    <th class="table-th">データ</th>
                </tr>
            </thead>
                <tr class="table-tr">
                    <td class="table-td">まめっち</td>
                    <td class="table-td">説明1</td>
                    <td class="table-td">データ1</td>
                </tr>
                <tr class="table-tr">
                    <td class="table-td">めめっち</td>
                    <td class="table-td">説明2</td>
                    <td class="table-td">データ2</td>
                </tr>
                <tr class="table-tr">
                    <td class="table-td">くちぱっち</td>
                    <td class="table-td">説明3</td>
                    <td class="table-td">データ3</td>
                </tr>
        </table>
    </section>
</body>
</html>
